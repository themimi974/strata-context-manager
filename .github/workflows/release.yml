# On a version tag (v0.1.0, ...): build both images and push them to Docker Hub.
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token, Read & Write).
name: release
on:
  push:
    tags: ["v*"]
jobs:
  images:
    runs-on: ubuntu-latest
    if: ${{ vars.DOCKERHUB_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build and push
        run: |
          v=${GITHUB_REF_NAME#v}
          u=${{ secrets.DOCKERHUB_USERNAME }}
          docker build -t $u/strata-context-manager:$v -t $u/strata-context-manager:latest .
          docker build -f docker/litellm/Dockerfile -t $u/strata-context-manager-litellm:$v -t $u/strata-context-manager-litellm:latest .
          docker push --all-tags $u/strata-context-manager
          docker push --all-tags $u/strata-context-manager-litellm
