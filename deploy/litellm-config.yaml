# LiteLLM routing to Strata, with the strata-context-manager hook.
# Values in os.environ/... come from deploy/.env through compose.
model_list:
  - model_name: qwen3.8-flash-next               # what clients ask for; keep equal to MODEL_NAME in .env
    litellm_params:
      model: os.environ/STRATA_MODEL             # "openai/" + Strata's model_name, e.g. openai/qwen3.8-flash-next-iq2_xs
      api_base: os.environ/STRATA_API_BASE       # STRATA_URL + /v1, set by compose.yaml
      api_key: none
      timeout: 3600                              # a cold 125K prompt takes minutes to read on one MI100
      stream_timeout: 3600
    model_info:
      max_input_tokens: 131072                   # = Strata --max-context; tell your agent the same value
      max_output_tokens: 32768
      supports_function_calling: true

litellm_settings:
  callbacks: strata_context_hook.handler
  drop_params: true
  request_timeout: 3600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_prompts_in_spend_logs: false
  database_connection_pool_limit: 10
  proxy_batch_write_at: 60
